[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-slide"
version = "0.3.2"
description = "Local-first, evidence-backed Korean business slide comprehension engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24,<2"]
pptx = ["python-pptx>=0.6.23,<2"]
ocr-paddle = ["paddlepaddle>=3,<4", "paddleocr>=3,<4"]
dev = ["pytest>=8,<9", "fonttools>=4,<5"]

[project.scripts]
k-slide = "k_slide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
