name: K-Slide full public evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  public-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document tools and Korean font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libreoffice
      - name: Install K-Slide
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pdf,pptx,dev]"
      - name: Generate all default-format corpus cases
        run: PYTHONPATH=src python -m evals.generate_corpus --output "$RUNNER_TEMP/k-slide-corpus" --formats png jpg webp pdf pptx
      - name: Run development engine evidence suite
        run: PYTHONPATH=src python -m evals.run_engine_eval --output "$RUNNER_TEMP/k-slide-engine-dev" --split development --formats png pdf pptx --candidate-profile evals/production-candidate.yaml
      - name: Run validation engine evidence suite
        run: PYTHONPATH=src python -m evals.run_engine_eval --output "$RUNNER_TEMP/k-slide-engine-validation" --split validation --formats png pdf pptx --candidate-profile evals/production-candidate.yaml
      - name: Upload evaluation summaries
        uses: actions/upload-artifact@v4
        with:
          name: k-slide-engine-evaluation
          path: |
            ${{ runner.temp }}/k-slide-engine-dev/summary.json
            ${{ runner.temp }}/k-slide-engine-validation/summary.json
