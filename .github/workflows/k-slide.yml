name: K-Slide

on:
  push:
    paths:
      - "**"
      - ".github/workflows/k-slide.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/k-slide.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: integrations/vscode/.nvmrc
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - name: Install verified Korean font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install K-Slide test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pdf,pptx,dev]"
      - name: Compile
        run: python -m compileall -q src tests evals tools
      - name: Unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Clean installed wheel verification
        run: bash ./scripts/verify_python_package.sh
      - name: OpenCode host contracts with pinned dependencies
        run: bash ./scripts/verify_opencode_host.sh
      - name: Preinstalled OpenCode host package
        run: python scripts/build_opencode_bundle.py --output "$RUNNER_TEMP/k-slide-opencode.tar.gz"
      - name: VS Code adapter tests and clean package verification
        run: |
          npm ci --no-audit --no-fund --prefix integrations/vscode
          npm test --prefix integrations/vscode
          ./scripts/verify_vscode_extension.sh "$RUNNER_TEMP/k-slide.vsix"
      - name: Retain host packages for administrator installation
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: k-slide-host-packages-not-production-certified
          path: |
            ${{ runner.temp }}/k-slide.vsix
            ${{ runner.temp }}/k-slide-opencode.tar.gz
            ${{ runner.temp }}/k-slide-opencode.tar.gz.json
      - name: Doctor and installer smoke
        run: |
          PYTHONPATH=src python -m k_slide.cli doctor --root . --json
          rm -rf "$RUNNER_TEMP/k-slide-host"
          ./scripts/install_project.sh "$RUNNER_TEMP/k-slide-host"
          ./scripts/verify_install.sh "$RUNNER_TEMP/k-slide-host"
      - name: Synthetic artifact evaluation smoke
        run: PYTHONPATH=src python -m evals.run_engine_eval --output "$RUNNER_TEMP/k-slide-eval" --split development --limit 2 --formats png pdf --candidate-profile evals/production-candidate.yaml
